<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Odontológico OdontoPlus</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- CSS App -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>

<body>

    <!-- App Container -->
    <div id="app-content" style="width: 100%; height: 100%;">
        <!-- El contenido de la SPA se inyectará aquí -->
    </div>

    <!-- Configuración e Infraestructura HTTP -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/theme.js"></script>

    <!-- Componentes Reutilizables (antes que los módulos para que Toast esté disponible) -->
    <script src="components/modal.js"></script>
    <script src="components/toast.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/topbar.js"></script>
    <script src="components/table.js"></script>
    <script src="components/charts.js"></script>

    <!-- Cliente HTTP y Autenticación -->
    <script src="assets/js/apiClient.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/permissions.js"></script>

    <!-- Servicios de dominio -->
    <script src="assets/js/services/dashboardService.js"></script>
    <script src="assets/js/services/patientService.js"></script>
    <script src="assets/js/services/appointmentService.js"></script>
    <script src="assets/js/services/inventoryService.js"></script>
    <script src="assets/js/services/billingService.js"></script>
    <script src="assets/js/services/usuarioService.js"></script>

    <!-- Módulos de Negocio (páginas) -->
    <script src="pages/login.js"></script>
    <script src="pages/dashboard.js"></script>
    <script src="pages/patients.js"></script>
    <script src="pages/appointments.js"></script>
    <script src="pages/inventory.js"></script>
    <script src="pages/billing.js"></script>
    <script src="pages/reports.js"></script>
    <script src="pages/settings.js"></script>

    <!-- Router y App Principal -->
    <script src="assets/js/router.js"></script>
    <script src="assets/js/app.js"></script>

</body>

</html>
